<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Práctica 7 — Introducción a JavaScript</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body class="bg-light py-4">

  <div class="container">
    <h1 class="text-center mb-4">Introducción a JavaScript</h1>

    <!-- Sección a -->
    <section class="card shadow-sm mb-4 p-4" id="sec-variables">
      <h2 class="h4">a) Variables y salida</h2>
      <div>
        <button id="btnDatos" class="btn btn-primary mt-2">Mostrar datos</button>
      </div>
      <p id="parDatos" class="mt-3 p-3 bg-white border rounded" style="white-space: pre-line;"></p>
    </section>

    <!-- Sección b -->
    <section class="card shadow-sm mb-4 p-4" id="sec-calcs">
      <h2 class="h4">b) Calculadora de calificaciones</h2>
      <div class="row g-3 mt-1">
        <div class="col-md-4"><input type="number" id="p1" class="form-control" placeholder="Parcial 1"></div>
        <div class="col-md-4"><input type="number" id="p2" class="form-control" placeholder="Parcial 2"></div>
        <div class="col-md-4"><input type="number" id="p3" class="form-control" placeholder="Parcial 3"></div>
      </div>
      <div class="mt-3">
        <button id="btnCalc" class="btn btn-success">Calcular promedio</button>
      </div>
      <p id="parCalc" class="mt-3 fw-bold fs-5 mb-0"></p>
    </section>

    <!-- Sección c -->
    <section class="card shadow-sm mb-4 p-4" id="sec-lista">
      <h2 class="h4">c) Lista dinámica</h2>
      <div class="input-group mt-2">
        <input type="text" id="inputItem" class="form-control" placeholder="Escribe un elemento...">
        <button id="btnAgregar" class="btn btn-primary">Agregar</button>
        <button id="btnLimpiar" class="btn btn-outline-danger">Limpiar todo</button>
      </div>
      <ul id="miLista" class="list-group mt-3"></ul>
    </section>

    <!-- Sección d -->
    <section class="card shadow-sm mb-4 p-4" id="sec-estilos">
      <h2 class="h4">d) Cambio de estilos</h2>
      <div class="d-flex flex-wrap gap-2 mt-2">
        <button class="btn btn-warning" onclick="cambiarFondo('FFF3CD')">Fondo Amarillo</button>
        <button class="btn btn-info text-white" onclick="cambiarFondo('D1ECF1')">Fondo Azul</button>
        <button class="btn btn-success" onclick="cambiarFondo('D4EDDA')">Fondo Verde</button>
        <button class="btn btn-secondary" onclick="cambiarFondo('FFFFFF')">Restaurar</button>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
